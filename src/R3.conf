hostname R3

!
interface Loopback1
  ip address 30.0.0.1 255.255.255.255
!
!
interface FastEthernet0/0
 ip address 198.51.100.5 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
!
interface FastEthernet1/0
 ip address 198.51.102.5 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
router ospf 3
  network 198.51.100.0 0.0.0.255 area 0
  network 198.51.102.0 0.0.0.255 area 0
  network 30.0.0.1 0.0.0.0 area 0
!

